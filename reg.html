<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/login.html">
        <label>name</label><br>
        <input type="text" placeholder="Enter your name" required><br>
        <label>email</label><br>
        <input type="email" placeholder="Enter your email" required><br>
        <label>password</label><br>
        <input type="password" placeholder="Enter your password" required><br>
        <label>mobile number</label><br>
        <input type="number" placeholder="Enter your mobile number" required><br>
        <label>upload resume</label><br>
        <input type="file" required><br>
        <label>skills</label><br>
        <input type="text" placeholder="Enter your skills" required><br>
        <label>date of birth</label><br>
        <input type="date" required><br>
        <label>time of application</label><br>
        <input type="time" required><br>
        <button type="submit">Register</button>
    </form>
